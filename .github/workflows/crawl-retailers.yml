name: Run Retailers Crawler

on:
  schedule:
    # Run at 2:00 AM UTC every day
    # Customize this cron expression as needed: https://crontab.guru/
    - cron: '0 2 * * *'
  
  # Allow manual triggering from the GitHub Actions tab
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: |
          cd backend
          npm install
          # Install Puppeteer dependencies (kept for compatibility)
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/scrapy_scrapers/requirements.txt
          pip install crawl4ai
          pip install aiohttp aiofiles
          # Install Firecrawl SDK
          pip install firecrawl-py
          
      - name: Create service account file
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > sa-key.json
        working-directory: backend
        
      - name: Run Firecrawl crawler for all retailers
        run: |
          cd backend/scrapers/crawl4ai_scrapers
          # Create data directory if it doesn't exist
          mkdir -p ./data
          # Run Firecrawl for all retailers
          python3 run_firecrawl_all.py --limit 200 --db-path ./data/products.db --output ./firecrawl_results.json
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ../../sa-key.json
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          FIREBASE_PUSH: 'true'
          
      - name: Upload results artifact
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: firecrawl-results
          path: backend/scrapers/crawl4ai_scrapers/firecrawl_results.json
          
      - name: Clean up credentials
        if: always()
        run: |
          rm -f backend/sa-key.json 